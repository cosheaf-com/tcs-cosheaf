id: issue.downstream-accepted-status.0001
type: issue
title: 'P1: Downstream accepted status not properly handled when upstream conclusion
  is withdrawn'
status: open
authors:
- operator
severity: high
description: 'When an accepted item depends on a base item, changing the base item''s
  status to `refuted` does not invalidate the downstream item''s accepted status,
  and the gate does not block it. Withdrawing or refuting an item must calculate reverse
  dependency impacts, either rejecting operations with unhandled impacts or marking
  related conclusions for re-review. Readiness, preview, and execution must share
  the same policy function.

  '
tags:
