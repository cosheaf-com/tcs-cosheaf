id: issue.execution-record-overwrite.0001
type: issue
title: 'P1: Execution records are overwritten, history not fully preserved'
status: open
authors:
- operator
severity: high
description: 'Provider gateway uses a fixed `run.provider.0001` ID, and request IDs
  are also fixed, causing subsequent provider calls to overwrite previous logs. Workflows
  have a similar issue where restarting with the same ID overwrites the main record
  and clears steps. Implement unique IDs for every run, attempt, and model call. Separate
  `create` from `update`. Ensure run history is append-only, and updates perform revision
  checks.

  '
