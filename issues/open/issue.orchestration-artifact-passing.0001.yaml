id: issue.orchestration-artifact-passing.0001
type: issue
title: 'P1: Task artifacts are not passed downstream in orchestration'
status: open
authors:
- operator
severity: high
description: 'In the hosted planner, `runner` passes the same initial artifact ID
  list to reasoner, verifier, and review nodes. The reasoner''s output is not provided
  as input to the verifier. Task responsibilities must be implemented via data flow.
  Additionally, builtin actions invoke CLI via subprocesses, causing failures and
  losing state. Builtin actions should directly call typed application services with
  shared execution kernel.

  '
