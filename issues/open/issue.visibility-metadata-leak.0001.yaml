description: 'Private visibility judgment is dispersed. Creating a private draft with
  name="research" and path="kb/private" results in the public-only site export excluding
  it, but the public MCP resource endpoint (`cosheaf://artifacts/public/.../card`)
  returning its title, path, domain, and tags. Introduce an explicit `visibility:
  public | private` field and use it consistently across search, export, MCP, context,
  and provider policies.

  '
