id: issue.web-preview-confirmation-binding.0001
type: issue
title: 'P2: Live web data mixed with demo values, preview and confirmation not bound'
status: open
authors:
- operator
severity: medium
description: 'The real-time frontend mixes demo values (e.g., empty violation arrays,
  discarded dependency edges). Also, the editor allows previewing state A, changing
  the form to B, but confirming B. The backend should output a common `WorkspaceSnapshot`
  and use a unified `WritePlan` for write operations, where input changes invalidate
  old plans and server confirmation checks the request against expected revisions.

  '
